name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Credenciales
        run: ./scripts/check-secrets.sh

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Precios simulados: el recorrido prueba la app, no la disponibilidad de
      # las APIs publicas de mercado.
      - name: Levantar la app
        run: |
          npm run build
          WALTRA_MOCK=1 npm start &
          npx wait-on http://127.0.0.1:3000 --timeout 60000
        env:
          NODE_ENV: production

      - name: Recorrido end-to-end
        run: npm run e2e

      # La promesa de PWA (instalable y usable sin conexion) solo se puede
      # verificar contra un build de produccion: el service worker no se
      # registra en desarrollo.
      - name: PWA e instalación
        run: npm run pwa
        env:
          BASE_URL: http://127.0.0.1:3000

      # El build del APK sirve archivos sueltos, sin servidor. Se recorre en
      # un navegador para saber que arranca y que las pantallas del modo
      # telefono estan, sin necesitar un Android de verdad.
      - name: Build nativo en el navegador
        run: |
          WALTRA_NATIVE=1 npx next build
          npm run native

  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Capacitor 8 compila con el plugin de Android que pide JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # El runner de ubuntu ya trae el SDK de Android. No se usa
      # android-actions/setup-android porque intenta instalar el paquete
      # `tools`, que Google retiro del repositorio, y falla antes de empezar.
      # Solo hay que asegurarse de que esten la plataforma y las build-tools
      # que pide android/variables.gradle.
      - name: Preparar el SDK
        run: |
          set -euo pipefail
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci

      # Exporta el HTML estatico y lo copia adentro del proyecto Android.
      - name: Preparar los assets
        run: npm run build:native

      - name: Compilar
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # Firmado con la clave de depuracion, que es la que viene con el SDK.
      # Alcanza para instalarlo a mano; no sirve para publicar en Play, que no
      # es el plan. En el README esta como pasar a una clave propia.
      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: waltra-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
