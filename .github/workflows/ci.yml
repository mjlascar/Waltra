name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Credenciales
        run: ./scripts/check-secrets.sh

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Precios simulados: el recorrido prueba la app, no la disponibilidad de
      # las APIs publicas de mercado.
      - name: Levantar la app
        run: |
          npm run build
          WALTRA_MOCK=1 npm start &
          npx wait-on http://127.0.0.1:3000 --timeout 60000
        env:
          NODE_ENV: production

      - name: Recorrido end-to-end
        run: npm run e2e

      # La promesa de PWA (instalable y usable sin conexion) solo se puede
      # verificar contra un build de produccion: el service worker no se
      # registra en desarrollo.
      - name: PWA e instalación
        run: npm run pwa
        env:
          BASE_URL: http://127.0.0.1:3000

      # El build del APK sirve archivos sueltos, sin servidor. Se recorre en
      # un navegador para saber que arranca y que las pantallas del modo
      # telefono estan, sin necesitar un Android de verdad.
      - name: Build nativo en el navegador
        run: |
          WALTRA_NATIVE=1 npx next build
          npm run native

  apk:
    name: APK
    runs-on: ubuntu-latest
    # Para publicar el APK como release descargable.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Capacitor 8 compila con el plugin de Android que pide JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # El runner de ubuntu ya trae el SDK de Android. No se usa
      # android-actions/setup-android porque intenta instalar el paquete
      # `tools`, que Google retiro del repositorio, y falla antes de empezar.
      # Solo hay que asegurarse de que esten la plataforma y las build-tools
      # que pide android/variables.gradle.
      - name: Preparar el SDK
        run: |
          set -euo pipefail
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci

      # Exporta el HTML estatico y lo copia adentro del proyecto Android.
      - name: Preparar los assets
        run: npm run build:native

      # Android identifica una app por su paquete Y su firma. Dos APK del
      # mismo paquete firmados distinto no se instalan uno encima del otro:
      # hay que desinstalar, y eso borra los movimientos.
      #
      # Con el secreto cargado se firma siempre igual y las actualizaciones
      # conservan los datos. Sin el se genera una clave descartable, para que
      # el APK salga instalable igual y, sobre todo, para que el camino de
      # release se compile en cada corrida en vez de quedar sin probar hasta
      # el dia que alguien cargue el secreto.
      - name: Preparar la firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/waltra.keystore"
            echo "estable=si" >> "$GITHUB_OUTPUT"
            echo "Firma propia: las actualizaciones se instalan encima."
          else
            keytool -genkeypair -noprompt \
              -keystore "$RUNNER_TEMP/waltra.keystore" \
              -alias waltra -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass descartable -keypass descartable \
              -dname "CN=Waltra"
            echo "estable=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64 el APK va firmado con una clave descartable, distinta en cada corrida: sirve para probar, pero no se puede instalar encima de una versión anterior sin desinstalar, y desinstalar borra los datos. El README explica cómo generar la clave propia."
          fi

      - name: Compilar
        working-directory: android
        env:
          WALTRA_VERSION_CODE: ${{ github.run_number }}
          WALTRA_VERSION_NAME: 1.0.${{ github.run_number }}
          WALTRA_KEYSTORE_FILE: ${{ runner.temp }}/waltra.keystore
          WALTRA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'descartable' }}
          WALTRA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'waltra' }}
          WALTRA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'descartable' }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: waltra-apk${{ steps.firma.outputs.estable == 'no' && '-firma-descartable' || '' }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      # Los artefactos de Actions vienen en un zip, piden estar logueado y no
      # se pueden bajar desde la app de GitHub del celular. Un release resuelve
      # las tres cosas: el APK se baja directo, desde cualquier navegador, y el
      # enlace es siempre el mismo, asi que se puede compartir y guardar.
      #
      # Se borra y se rehace en vez de editarlo para que la etiqueta apunte
      # siempre al commit que se acaba de compilar.
      - name: Publicar el APK para descargar
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          ESTABLE: ${{ steps.firma.outputs.estable }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk waltra.apk
          if [ "$ESTABLE" = "si" ]; then
            firma="Firmado con la clave del repositorio: las actualizaciones se instalan encima y conservan los datos."
          else
            firma="ATENCION: firmado con una clave descartable, distinta en cada compilacion. Sirve para probar, pero no se puede instalar encima de una version anterior sin desinstalar, y desinstalar borra los movimientos. El README explica como configurar una clave propia."
          fi
          notas=$(printf '%s\n\n%s\n\n%s' \
            "Version 1.0.${GITHUB_RUN_NUMBER}, de ${GITHUB_SHA:0:8} en ${GITHUB_REF_NAME}." \
            "$firma" \
            "Descarga waltra.apk de aca abajo y abrilo en el telefono. Android va a pedirte permitir instalar desde el navegador: es el paso normal para algo que no viene de Play.")
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest waltra.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Waltra - ultima compilacion" \
            --notes "$notas"
          echo "Descarga directa: https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/waltra.apk"
