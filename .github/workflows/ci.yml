name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Credenciales
        run: ./scripts/check-secrets.sh

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Precios simulados: el recorrido prueba la app, no la disponibilidad de
      # las APIs publicas de mercado.
      - name: Levantar la app
        run: |
          npm run build
          WALTRA_MOCK=1 npm start &
          npx wait-on http://127.0.0.1:3000 --timeout 60000
        env:
          NODE_ENV: production

      - name: Recorrido end-to-end
        run: npm run e2e

      # La promesa de PWA (instalable y usable sin conexion) solo se puede
      # verificar contra un build de produccion: el service worker no se
      # registra en desarrollo.
      - name: PWA e instalación
        run: npm run pwa
        env:
          BASE_URL: http://127.0.0.1:3000

      # El build del APK sirve archivos sueltos, sin servidor. Se recorre en
      # un navegador para saber que arranca y que las pantallas del modo
      # telefono estan, sin necesitar un Android de verdad.
      - name: Build nativo en el navegador
        run: |
          WALTRA_NATIVE=1 npx next build
          npm run native

  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Capacitor 8 compila con el plugin de Android que pide JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # El runner de ubuntu ya trae el SDK de Android. No se usa
      # android-actions/setup-android porque intenta instalar el paquete
      # `tools`, que Google retiro del repositorio, y falla antes de empezar.
      # Solo hay que asegurarse de que esten la plataforma y las build-tools
      # que pide android/variables.gradle.
      - name: Preparar el SDK
        run: |
          set -euo pipefail
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci

      # Exporta el HTML estatico y lo copia adentro del proyecto Android.
      - name: Preparar los assets
        run: npm run build:native

      # Android identifica una app por su paquete Y su firma. Con la clave de
      # depuracion, que cada corrida genera distinta, el APK nuevo no se puede
      # instalar encima del viejo: habria que desinstalar, y eso borra los
      # movimientos. Con el secreto cargado se firma siempre igual y las
      # actualizaciones conservan los datos.
      #
      # Sin el secreto el build igual sale, con la clave de depuracion, para
      # poder probarlo. El README explica como generar la propia.
      - name: Preparar la firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/waltra.keystore"
            echo "modo=release" >> "$GITHUB_OUTPUT"
            echo "Firma propia: las actualizaciones se instalan encima."
          else
            echo "modo=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: el APK va firmado con la clave de depuración y no se puede instalar encima de una versión anterior sin desinstalar (lo que borra los datos). Está explicado en el README."
          fi

      - name: Compilar
        working-directory: android
        env:
          WALTRA_VERSION_CODE: ${{ github.run_number }}
          WALTRA_VERSION_NAME: 1.0.${{ github.run_number }}
          WALTRA_KEYSTORE_FILE: ${{ steps.firma.outputs.modo == 'release' && format('{0}/waltra.keystore', runner.temp) || '' }}
          WALTRA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WALTRA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WALTRA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.firma.outputs.modo }}" = "release" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: waltra-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
